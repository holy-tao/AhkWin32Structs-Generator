# IUnknown extensions
# TODO: add a fallback for IInspectable::As to loop through required IIDs and check names against requested type for parameterized types

add-to:
  - Windows.Win32.System.Com.IUnknown
requires: []
code: |
    /**
     * Determines whether or not this interface and some other interface refer to the
     * same underlying object by comparing the pointers retrieved from QueryInterface
     * @param {IUnknown | ComObject} other the interface to compare this one to. If 
     *          other is a native AHK ComObject, its IUnknown pointer is retrieved via
     *          `ComObjQuery`
     * @returns 1 if this and other refer to the same object, 0 if they don't
     */
    Equals(other){
        if(!(other is IUnknown || other is ComObject)){
            throw TypeError("Expected a Win32ComInterface extending IUnknown or a ComObject, but got a(n) " . type(other))
        }

        thisPtrBuf := Buffer(A_PtrSize)
        this.QueryInterface(IUnknown.IID, thisPtrBuf)
        thisPtr := NumGet(thisPtrBuf, "ptr")
        
        otherPtr := 0

        if(other is IUnknown){
            other.QueryInterface(IUnknown.IID, &otherPtr)
            otherInterface := IUnknown(otherPtr)  ; This object will release the pointer when it falls out of scope
        }
        else{
            ;Native AHK ComObject, use ComObjQuery
            otherPtr := ComObjQuery(other, String(IUnknown.IID)).ptr
        }

        return thisPtr == otherPtr
    }

    /**
     * Queries the interface for `iface` and returns the found interface proxy, effectively "casting" the interface
     * as another type. This can also be used to cast WinRT classes as other types.
     *
     *      stringable := MyInterfaceProxy.As(IStringable)
     *
     * Parameterized types (that is, types with generic arguments, like `IVector<Int32>`) are not currently supported.
     * 
     * @param {Class extending Win32ComInterface} iface the interface to query for.
     * @returns {Win32ComInterface} an instance of `iface` if this interface supports it.
     * @throws {TypeError} if this interface does not support `iface` or `iface` is invalid
     */
    As(iface) {
        queryResult := this.QueryInterface(iface.IID, &outPtr := 0)
        if(queryResult != 0){
            msg := Format("Could not cast `"{1}`" as `"{2}`"", type(this), iface.prototype.__Class)
            throw OSError(queryResult, -1, msg)
        }

        return iface.Call(outPtr)
    }

    __Delete(){
        if(!this.owned){
            this.Release()
        }
    }