# This documents mappings from .NET to WinRT types. This should only be necessary when the .NET type and the WinRT
# type have different names or are in different namespaces, or if for some reason we need to always treat a type as
# a different type than it appears as in the metadata. Ensure that type names include the backtick generic count -
# e.g. "IVector`1" for "List<T>"
# See: https://learn.microsoft.com/en-us/windows/apps/develop/platform/csharp-winrt/net-mappings-of-winrt-types

# Note that these map types - there's currently no way to map primitives to types because they don't go through the
# type resolution process, so e.g. 
#     System.Object -> Windows.Foundation.IInspectable
#     WinRT string -> Windows.Win32.System.WinRT.HSTRING
# still need to be handled separately in the codegen.

# Format is
# AssemblyName:
#   .Net FQN: 
#     Assembly: <Windows>
#     Namespace: <Widows.Foundation>
#     Name: <DateTime>

System.DateTimeOffset: 
  Assembly: Windows
  Namespace: Windows.Foundation
  Name: DateTime
System.EventHandler: 
  Assembly: Windows
  Namespace: Windows.Foundation
  Name: EventHandler`1
System.Runtime.InteropServices.WindowsRuntime.EventRegistrationToken: 
  Assembly: Windows
  Namespace: Windows.Foundation
  Name: EventRegistrationToken
