name: Regenerate Bindings

on:
  workflow_dispatch:
    inputs:
        force:
          description: 'Force regeneration even if no updates detected'
          type: boolean
          required: false
  schedule:
    - cron: '0 1 * * 1'  # every Monday 01:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  update-packages:
    uses: ./.github/workflows/update-packages.yml  # your existing workflow
    secrets: inherit


  generate-bindings:
    needs: update-packages
    if: needs.update-packages.outputs.did-update == 'true' || github.event.inputs.force == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout Generator Repo
        uses: actions/checkout@v4
        with:
          repository: holy-tao/AhkWin32Structs-Generator
          lfs: true
          path: generator
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Build Generator
        shell: pwsh
        working-directory: generator
        run: dotnet build -c Release

      - name: Checkout Bindings Repo
        uses: actions/checkout@v4
        with:
          repository: holy-tao/AhkWin32Projection
          path: bindings
          token: ${{ secrets.WIN32_PAT }}
          fetch-depth: 0

      - name: Run Generator
        shell: pwsh
        run: |
          $generatorExe = Join-Path "generator" "Generator/bin/release/net9.0/AhkWin32Structs.exe"
          $logLevel = if ($env:RUNNER_DEBUG -eq '1') { 'Debug' } else { 'Information' }
          & $generatorExe $(Join-Path $env:GITHUB_WORKSPACE "generator" "metadata") $(Join-Path $env:GITHUB_WORKSPACE "bindings") --log-file generator.log --log-level $logLevel

      - name: Upload Generator Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generator-log
          path: generator.log
          retention-days: 14

      - name: Compute PR Title and Body
        id: pr-meta
        shell: pwsh
        run: |
          $components = @()

          if ('${{ needs.update-packages.outputs.metadata-did-update }}' -eq 'true') {
              $components += [pscustomobject]@{
                  Name = "Win32 Metadata"
                  Old = '${{ needs.update-packages.outputs.metadata-old-version }}'
                  New = '${{ needs.update-packages.outputs.metadata-version }}'
                  Link = "[**${{ needs.update-packages.outputs.metadata-version }}**](https://github.com/microsoft/win32metadata/releases/tag/v${{ needs.update-packages.outputs.metadata-version }})"
              }
          }
          if ('${{ needs.update-packages.outputs.wdk-metadata-did-update }}' -eq 'true') {
              $components += [pscustomobject]@{
                  Name = "WDK Metadata"
                  Old = '${{ needs.update-packages.outputs.wdk-metadata-old-version }}'
                  New = '${{ needs.update-packages.outputs.wdk-metadata-version }}'
                  Link = "[**${{ needs.update-packages.outputs.wdk-metadata-version }}**](https://github.com/microsoft/wdkmetadata/releases/tag/v${{ needs.update-packages.outputs.wdk-metadata-version }})"
              }
          }
          if ('${{ needs.update-packages.outputs.apidocs-did-update }}' -eq 'true') {
              $components += [pscustomobject]@{
                  Name = "ApiDocs"
                  Old = '${{ needs.update-packages.outputs.apidocs-old-version }}'
                  New = '${{ needs.update-packages.outputs.apidocs-version }}'
                  Link = "**${{ needs.update-packages.outputs.apidocs-version }}**"
              }
          }

          $title = "Update " + (($components | ForEach-Object { "$($_.Name) to $($_.New)" }) -join " and ")

          $body = "Automated update of generated bindings.`n"
          foreach ($c in $components) {
              $body += "- $($c.Name): $($c.Link) (was **$($c.Old)**)`n"
          }
          $body += "`nTriggered by update-packages workflow."

          Write-Output "title=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          $delimiter = "BODY_EOF_$(New-Guid)"
          Write-Output "body<<$delimiter" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output $body | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output $delimiter | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Open Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.WIN32_PAT }}
          path: bindings
          base: main
          branch: feature/update-metadata
          commit-message: "Update Win32 Metadata"
          title: ${{ steps.pr-meta.outputs.title }}
          assignees: holy-tao
          body: ${{ steps.pr-meta.outputs.body }}