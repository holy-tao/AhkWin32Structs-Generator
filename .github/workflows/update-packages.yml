name: Update Packages

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      metadata-version:
        description: 'The new version of the win32 metadata package'
        value: ${{ jobs.update.outputs.metadata-version }}
      wdk-metadata-version:
        description: 'The new version of the win32 WDK metadata package'
        value: ${{ jobs.update.outputs.wdk-metadata-version }}
      apidocs-version:
        description: 'The new version of the win32 apidocs package'
        value: ${{ jobs.update.outputs.apidocs-version }}
      did-update:
        description: 'Whether any packages were updated'
        value: ${{ jobs.update.outputs.did-update }}

permissions:
  contents: write

jobs:
  update:
    name: Update Packages
    runs-on: windows-latest
    outputs:
      metadata-version: ${{ steps.commit-metadata.outputs.version }}
      wdk-metadata-version: ${{ steps.commit-wdk.outputs.version }}
      apidocs-version: ${{ steps.commit-docs.outputs.version }}
      did-update: ${{ steps.summary.outputs.did-update }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DEPLOY_KEY }}

      - name: Configure Git
        shell: pwsh
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

      # --- Win32 Metadata ---

      - name: Download Win32Metadata
        shell: pwsh
        run: ./scripts/Get-Win32Metadata.ps1

      - name: Commit Win32Metadata Changes
        id: commit-metadata
        shell: pwsh
        run: |
          $version = (Get-Content ./metadata/Microsoft.Windows.SDK.Win32Metadata.version -Raw).Trim()
          Write-Output "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          git add ./metadata/*.winmd
          git add ./metadata/*.version

          Write-Host "Staged changes:"
          git status --short

          git diff-index --quiet HEAD --
          if ($LASTEXITCODE -ne 0) {
              Write-Output "did-update=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              git commit -m "Update Win32Metadata to $version"
          } else {
              Write-Output "did-update=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              Write-Host "No changes to commit for Win32Metadata"
          }

      # --- WDK Metadata ---

      - name: Download WDKMetadata
        shell: pwsh
        run: ./scripts/Get-WDKMetadata.ps1

      - name: Commit WDK Metadata Changes
        id: commit-wdk
        shell: pwsh
        run: |
          $version = (Get-Content ./metadata/Microsoft.Windows.WDK.Win32Metadata.version -Raw).Trim()
          Write-Output "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          git add ./metadata/*.winmd
          git add ./metadata/*.version

          Write-Host "Staged changes:"
          git status --short

          git diff-index --quiet HEAD --
          if ($LASTEXITCODE -ne 0) {
              Write-Output "did-update=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              git commit -m "Update WDK Metadata to $version"
          } else {
              Write-Output "did-update=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              Write-Host "No changes to commit for WDK Metadata"
          }

      # --- Win32 Docs ---

      - name: Download Win32Docs
        shell: pwsh
        run: ./scripts/Get-Win32Docs.ps1

      - name: Commit Win32Docs Changes
        id: commit-docs
        shell: pwsh
        run: |
          $version = (Get-Content ./metadata/Microsoft.Windows.SDK.Win32Docs.version -Raw).Trim()
          Write-Output "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          git add ./metadata/*.msgpack
          git add ./metadata/*.version

          Write-Host "Staged changes:"
          git status --short

          git diff-index --quiet HEAD --
          if ($LASTEXITCODE -ne 0) {
              Write-Output "did-update=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              git commit -m "Update Win32Docs to $version"
          } else {
              Write-Output "did-update=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
              Write-Host "No changes to commit for Win32Docs"
          }

      # --- Push once, all commits together ---

      - name: Summarize and Push
        id: summary
        shell: pwsh
        run: |
          $didUpdate = @(
              '${{ steps.commit-metadata.outputs.did-update }}',
              '${{ steps.commit-wdk.outputs.did-update }}',
              '${{ steps.commit-docs.outputs.did-update }}'
          ) -contains 'true'

          Write-Output "did-update=$($didUpdate.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if ($didUpdate) {
              git push
          } else {
              Write-Host "No changes to push"
          }
